<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Defenda a Torre</title>
<style>
  html,body{margin:0;height:100%;background:#1b1530;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
  canvas{display:block;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100vw;height:auto;image-rendering:auto}
  @media (min-aspect-ratio:16/9){canvas{height:100vh;width:auto}}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 450, WALL_X = 150;
const ARCHER = { x: 95, y: 215 };

// ---------- estado ----------
let S;
function newGame() {
  S = {
    mode: 'menu', wave: 0, gold: 0, kills: 0,
    hp: 100, maxHp: 100,
    up: { dano: 1, rapidez: 1, muro: 1, multi: 1 },
    arrows: [], enemies: [], parts: [], texts: [],
    queue: [], spawnT: 0, cd: 0,
    aim: { x: 500, y: 300 }, holding: false, t: 0,
  };
}
newGame();
let best = 0; try { best = +localStorage.getItem('torre-best') || 0; } catch (e) {}

const stats = () => ({
  dmg: 1 + (S.up.dano - 1) * 0.6,
  delay: Math.max(0.12, 0.4 * Math.pow(0.85, S.up.rapidez - 1)),
  flechas: S.up.multi,
});

// ---------- bichinhos ----------
const TYPES = {
  slime: { cor: '#5fdc7a', escura: '#2f9a4b', r: 15, vel: 70, hp: 3,  ouro: 3,  dano: 3,  forma: 'bola' },
  bloco: { cor: '#ff6b6b', escura: '#b83b3b', r: 17, vel: 45, hp: 7,  ouro: 5,  dano: 6,  forma: 'quadrado' },
  golem: { cor: '#a88bff', escura: '#6a4fd1', r: 27, vel: 26, hp: 22, ouro: 14, dano: 12, forma: 'gordo' },
};

function startWave() {
  S.wave++;
  const n = 5 + S.wave * 2, q = [];
  for (let i = 0; i < n; i++) {
    let t = 'slime';
    const r = Math.random();
    if (S.wave >= 2 && r < 0.35) t = 'bloco';
    if (S.wave >= 4 && r < 0.12 + S.wave * 0.01) t = 'golem';
    q.push(t);
  }
  if (S.wave % 5 === 0) q.push('golem', 'golem');
  S.queue = q; S.spawnT = 1; S.mode = 'play';
}

function spawn(t) {
  const T = TYPES[t], esc = 1 + (S.wave - 1) * 0.18;
  S.enemies.push({ t, T, x: W + 40, y: GROUND - T.r, hp: T.hp * esc, max: T.hp * esc,
    vel: T.vel * (0.9 + Math.random() * 0.2), hitT: 0, atkT: 0, ph: Math.random() * 6 });
}

// ---------- loja ----------
const SHOP = [
  { k: 'dano',    nome: 'Flecha Afiada',   desc: '+60% de dano',          preco: l => 15 + l * 12 },
  { k: 'rapidez', nome: 'Arco Leve',       desc: 'atira mais rápido',     preco: l => 15 + l * 12 },
  { k: 'multi',   nome: 'Chuva de Flechas', desc: '+1 flecha por tiro',   preco: l => 40 + l * 35, max: 5 },
  { k: 'muro',    nome: 'Muralha de Pedra', desc: '+25 vida máx. e conserta', preco: l => 12 + l * 10 },
];
const btns = []; // regiões clicáveis da tela atual

function buy(item) {
  const lvl = S.up[item.k], p = item.preco(lvl);
  if ((item.max && lvl >= item.max) || S.gold < p) return;
  S.gold -= p; S.up[item.k]++;
  if (item.k === 'muro') { S.maxHp += 25; S.hp = S.maxHp; }
  beep(660, 0.08);
}

// ---------- input ----------
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  const p = toGame(e); S.aim = p; initAudio();
  for (const b of btns) if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) { b.fn(); return; }
  if (S.mode === 'play') S.holding = true;
});
cv.addEventListener('pointermove', e => { S.aim = toGame(e); });
addEventListener('pointerup', () => S.holding = false);
addEventListener('pointercancel', () => S.holding = false);
addEventListener('keydown', e => { if (e.code === 'Space') S.holding = true; });
addEventListener('keyup', e => { if (e.code === 'Space') S.holding = false; });

// ---------- som bem simples ----------
let ac;
function initAudio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function beep(f, d, type = 'square', vol = 0.04) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}

// ---------- update ----------
function shoot() {
  const st = stats(), n = st.flechas;
  const base = Math.atan2(S.aim.y - ARCHER.y, S.aim.x - ARCHER.x);
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.07, sp = 820;
    S.arrows.push({ x: ARCHER.x, y: ARCHER.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: st.dmg });
  }
  beep(900, 0.05, 'triangle', 0.03);
}

function update(dt) {
  S.t += dt;
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const t of S.texts) { t.y -= 30 * dt; t.life -= dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  if (S.mode !== 'play') return;

  // spawn
  S.spawnT -= dt;
  if (S.queue.length && S.spawnT <= 0) { spawn(S.queue.shift()); S.spawnT = Math.max(0.35, 1.3 - S.wave * 0.06) * (0.6 + Math.random() * 0.8); }

  // tiro
  S.cd -= dt;
  if (S.holding && S.cd <= 0) { shoot(); S.cd = stats().delay; }

  // flechas
  for (const a of S.arrows) {
    a.vy += 110 * dt; a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.y > GROUND) { a.dead = true; continue; }
    for (const e of S.enemies) {
      if (e.hp <= 0) continue;
      const dx = a.x - e.x, dy = a.y - e.y;
      if (dx * dx + dy * dy < (e.T.r + 8) ** 2) {
        e.hp -= a.dmg; e.hitT = 0.12; e.x += 6; a.dead = true;
        burst(a.x, a.y, e.T.cor, 4);
        if (e.hp <= 0) kill(e);
        break;
      }
    }
  }
  S.arrows = S.arrows.filter(a => !a.dead && a.x < W + 50 && a.x > -50);

  // bichinhos
  for (const e of S.enemies) {
    e.hitT -= dt; e.ph += dt * (e.vel / 8);
    const stop = WALL_X + e.T.r + 4;
    if (e.x > stop) e.x -= e.vel * dt;
    else {
      e.x = stop; e.atkT -= dt;
      if (e.atkT <= 0) {
        e.atkT = 1.1; S.hp -= e.T.dano; e.x += 10;
        burst(WALL_X + 4, e.y, '#c9b28a', 5); beep(120, 0.1, 'sawtooth', 0.05);
      }
    }
  }
  S.enemies = S.enemies.filter(e => e.hp > 0);

  if (S.hp <= 0) {
    S.hp = 0; S.mode = 'over'; S.holding = false;
    if (S.wave > best) { best = S.wave; try { localStorage.setItem('torre-best', best); } catch (e) {} }
    beep(200, 0.5, 'sawtooth', 0.06);
  } else if (!S.queue.length && !S.enemies.length) {
    const bonus = 10 + S.wave * 3; S.gold += bonus; S.holding = false; S.arrows = [];
    S.texts.push({ x: W / 2, y: 388, s: `Onda ${S.wave} vencida! +${bonus} ouro`, c: '#ffe066', life: 2 });
    S.mode = 'shop'; beep(523, 0.1); setTimeout(() => beep(784, 0.15), 110);
  }
}

function kill(e) {
  S.gold += e.T.ouro; S.kills++;
  burst(e.x, e.y, e.T.cor, 12);
  S.texts.push({ x: e.x, y: e.y - e.T.r - 10, s: '+' + e.T.ouro, c: '#ffe066', life: 0.8 });
  beep(300, 0.08, 'square', 0.04);
}
function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 240, life: 0.5 + Math.random() * 0.3, c });
}

// ---------- desenho ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#6ec3ff'); g.addColorStop(1, '#cdeeff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
  // nuvens
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 4; i++) {
    const x = ((i * 290 + S.t * 12) % (W + 200)) - 100, y = 60 + (i % 2) * 50;
    ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.arc(x + 25, y - 10, 28, 0, 7); ctx.arc(x + 55, y, 22, 0, 7); ctx.fill();
  }
  // morros
  ctx.fillStyle = '#8fd17a';
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, GROUND - 40 - Math.sin(x * 0.01) * 25);
  ctx.lineTo(W, GROUND); ctx.fill();
  // chão
  ctx.fillStyle = '#5bb04a'; ctx.fillRect(0, GROUND, W, 14);
  ctx.fillStyle = '#8a5a3b'; ctx.fillRect(0, GROUND + 14, W, H - GROUND);
}

function drawTower() {
  const dmg = 1 - S.hp / S.maxHp;
  // torre
  ctx.fillStyle = '#b9b1a3'; rr(40, 230, 110, GROUND - 230, 6); ctx.fill();
  ctx.fillStyle = '#a39a8a';
  for (let y = 245; y < GROUND; y += 28) for (let x = 46 + ((y / 28) % 2) * 14; x < 140; x += 30) ctx.fillRect(x, y, 22, 10);
  // ameias
  ctx.fillStyle = '#c9c2b4';
  for (let i = 0; i < 4; i++) ctx.fillRect(36 + i * 31, 214, 20, 20);
  ctx.fillRect(36, 226, 118, 10);
  // porta
  ctx.fillStyle = '#6b4226'; rr(78, GROUND - 60, 34, 60, [17, 17, 0, 0]); ctx.fill();
  // rachaduras
  if (dmg > 0.33) { ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(130, 270); ctx.lineTo(118, 300); ctx.lineTo(128, 330); ctx.stroke(); }
  if (dmg > 0.66) { ctx.beginPath(); ctx.moveTo(55, 300); ctx.lineTo(70, 340); ctx.lineTo(60, 380); ctx.stroke(); }
  // bandeira
  ctx.fillStyle = '#6b4226'; ctx.fillRect(56, 160, 4, 56);
  ctx.fillStyle = '#ff5d8f'; ctx.beginPath(); ctx.moveTo(60, 162); ctx.lineTo(88 + Math.sin(S.t * 5) * 4, 172); ctx.lineTo(60, 184); ctx.fill();

  // arqueiro
  const a = Math.atan2(S.aim.y - ARCHER.y, S.aim.x - ARCHER.x);
  ctx.save(); ctx.translate(ARCHER.x, ARCHER.y);
  ctx.fillStyle = '#3d7bd9'; rr(-10, -6, 20, 22, 6); ctx.fill();
  ctx.fillStyle = '#ffd6a8'; ctx.beginPath(); ctx.arc(0, -14, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(3, -15, 1.8, 0, 7); ctx.arc(-3, -15, 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#2f9a4b'; ctx.beginPath(); ctx.moveTo(-11, -18); ctx.lineTo(11, -18); ctx.lineTo(-2, -34); ctx.fill();
  ctx.rotate(a);
  ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(8, 0, 18, -1.2, 1.2); ctx.stroke();
  const pull = S.cd > 0 ? 0 : 6;
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(8 + Math.cos(-1.2) * 18, Math.sin(-1.2) * 18); ctx.lineTo(8 - pull, 0); ctx.lineTo(8 + Math.cos(1.2) * 18, Math.sin(1.2) * 18); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  const T = e.T, bob = Math.abs(Math.sin(e.ph)) * (T.forma === 'gordo' ? 3 : 6);
  const x = e.x, y = e.y - bob, r = T.r, hit = e.hitT > 0;
  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, GROUND + 2, r * 0.9, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = hit ? '#fff' : T.cor; ctx.strokeStyle = T.escura; ctx.lineWidth = 3;
  if (T.forma === 'bola') { ctx.beginPath(); ctx.ellipse(x, y + 2, r * 1.08, r * 0.92, 0, 0, 7); ctx.fill(); ctx.stroke(); }
  else if (T.forma === 'quadrado') { rr(x - r, y - r, r * 2, r * 2, 6); ctx.fill(); ctx.stroke(); }
  else { rr(x - r, y - r, r * 2, r * 2, 14); ctx.fill(); ctx.stroke(); ctx.fillStyle = T.escura; ctx.fillRect(x - r + 6, y + r - 10, 8, 6); ctx.fillRect(x + r - 14, y + r - 10, 8, 6); }
  // brilho
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(x - r * 0.4, y - r * 0.45, r * 0.25, r * 0.15, -0.5, 0, 7); ctx.fill();
  // olhinhos (olham pra torre)
  const ey = y - r * 0.15, es = Math.max(3, r * 0.2);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - r * 0.45, ey, es, 0, 7); ctx.arc(x + r * 0.1, ey, es, 0, 7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x - r * 0.45 - 1.5, ey, es * 0.55, 0, 7); ctx.arc(x + r * 0.1 - 1.5, ey, es * 0.55, 0, 7); ctx.fill();
  if (T.forma !== 'bola') { ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - r * 0.7, ey - es - 3); ctx.lineTo(x - r * 0.2, ey - es); ctx.moveTo(x + r * 0.35, ey - es - 3); ctx.lineTo(x - 0.05 * r, ey - es); ctx.stroke(); }
  // vida
  if (e.hp < e.max) {
    ctx.fillStyle = '#0006'; ctx.fillRect(x - r, y - r - 12, r * 2, 5);
    ctx.fillStyle = '#ff4d4d'; ctx.fillRect(x - r, y - r - 12, r * 2 * (e.hp / e.max), 5);
  }
}

function drawArrow(a) {
  const ang = Math.atan2(a.vy, a.vx);
  ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(ang);
  ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(4, 0); ctx.stroke();
  ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(1, -4); ctx.lineTo(1, 4); ctx.fill();
  ctx.fillStyle = '#ff5d8f'; ctx.fillRect(-19, -3, 5, 6);
  ctx.restore();
}

function txt(s, x, y, size, c = '#fff', align = 'center') {
  ctx.font = `bold ${size}px system-ui,sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = '#1b1530'; ctx.strokeText(s, x, y);
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}

function button(x, y, w, h, label, fn, on = true, sub) {
  ctx.fillStyle = on ? '#ffb340' : '#7a7590'; rr(x, y + 4, w, h, 12); ctx.fill();
  ctx.fillStyle = on ? '#ffd166' : '#9d98b3'; rr(x, y, w, h, 12); ctx.fill();
  txt(label, x + w / 2, y + h / 2 - (sub ? 9 : 0), sub ? 18 : 22);
  if (sub) txt(sub, x + w / 2, y + h / 2 + 13, 14, '#fff8');
  btns.push({ x, y, w, h, fn: on ? fn : () => {} });
}

function drawHud() {
  // vida da torre
  ctx.fillStyle = '#0007'; rr(16, 14, 240, 26, 8); ctx.fill();
  ctx.fillStyle = S.hp / S.maxHp > 0.3 ? '#4cd964' : '#ff4d4d'; rr(19, 17, 234 * (S.hp / S.maxHp), 20, 6); ctx.fill();
  txt(`Torre ${Math.ceil(S.hp)}/${S.maxHp}`, 136, 28, 15);
  txt(`🪙 ${S.gold}`, 280, 28, 20, '#ffe066', 'left');
  txt(`Onda ${S.wave}`, W - 20, 28, 22, '#fff', 'right');
  if (S.mode === 'play') txt(`faltam ${S.queue.length + S.enemies.length}`, W - 20, 54, 15, '#fffc', 'right');
}

function drawMenu() {
  ctx.fillStyle = '#1b1530cc'; ctx.fillRect(0, 0, W, H);
  txt('DEFENDA A TORRE', W / 2, 140, 54, '#ffd166');
  txt('Segure o dedo (ou o mouse) para mirar e atirar', W / 2, 205, 20);
  txt('Mate os bichinhos, ganhe ouro e melhore seu arco entre as ondas', W / 2, 235, 18, '#fffc');
  // mostruário dos bichinhos
  const demo = [['slime', 'Slime', 'rápido'], ['bloco', 'Bloco', 'teimoso'], ['golem', 'Golem', 'tanque']];
  demo.forEach(([t, n, d], i) => {
    const e = { T: TYPES[t], x: W / 2 - 160 + i * 160, y: 310, ph: S.t * 3 + i, hitT: 0, hp: 1, max: 1 };
    drawEnemy(e); txt(n, e.x, 355, 18, TYPES[t].cor); txt(d, e.x, 377, 14, '#fffc');
  });
  button(W / 2 - 110, 410, 220, 60, 'JOGAR', () => { newGame(); startWave(); });
  if (best) txt(`Recorde: onda ${best}`, W / 2, 500, 16, '#fffa');
}

function drawShop() {
  ctx.fillStyle = '#1b1530dd'; ctx.fillRect(0, 0, W, H);
  txt('🏹  Árvore do Arqueiro', W / 2, 80, 36, '#ffd166');
  txt(`Ouro: ${S.gold}`, W / 2, 120, 22, '#ffe066');
  SHOP.forEach((it, i) => {
    const x = 60 + i * 215, y = 160, lvl = S.up[it.k], maxed = it.max && lvl >= it.max, p = it.preco(lvl);
    ctx.fillStyle = '#2d2550'; rr(x, y, 195, 200, 14); ctx.fill();
    ctx.strokeStyle = '#ffd16655'; ctx.lineWidth = 2; ctx.stroke();
    txt(it.nome, x + 97, y + 30, 18, '#fff');
    txt(it.desc, x + 97, y + 60, 14, '#fffb');
    // bolinhas de nível
    const mx = it.max || 8;
    for (let j = 0; j < Math.min(mx, 8); j++) { ctx.fillStyle = j < lvl ? '#ffd166' : '#ffffff22'; ctx.beginPath(); ctx.arc(x + 97 - (Math.min(mx, 8) - 1) * 9 + j * 18, y + 95, 6, 0, 7); ctx.fill(); }
    txt(`Nível ${lvl}`, x + 97, y + 120, 15, '#fffc');
    button(x + 20, y + 140, 155, 46, maxed ? 'MÁXIMO' : `🪙 ${p}`, () => buy(it), !maxed && S.gold >= p);
  });
  button(W / 2 - 130, 410, 260, 64, `Próxima onda (${S.wave + 1}) ▶`, startWave);
}

function drawOver() {
  ctx.fillStyle = '#1b1530dd'; ctx.fillRect(0, 0, W, H);
  txt('A torre caiu!', W / 2, 160, 52, '#ff6b6b');
  txt(`Você chegou na onda ${S.wave} e derrotou ${S.kills} bichinhos`, W / 2, 230, 22);
  txt(`Recorde: onda ${best}`, W / 2, 270, 18, '#ffe066');
  button(W / 2 - 120, 330, 240, 64, 'Tentar de novo', () => { newGame(); startWave(); });
}

function draw() {
  btns.length = 0;
  drawBg(); drawTower();
  for (const e of S.enemies) drawEnemy(e);
  for (const a of S.arrows) drawArrow(a);
  for (const p of S.parts) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  if (S.mode === 'play' && S.aim) { ctx.strokeStyle = '#fff8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(S.aim.x, S.aim.y, 10, 0, 7); ctx.stroke(); }
  if (S.mode !== 'menu') drawHud();
  if (S.mode === 'menu') drawMenu();
  if (S.mode === 'shop') drawShop();
  if (S.mode === 'over') drawOver();
  for (const t of S.texts) { ctx.globalAlpha = Math.min(1, t.life * 2); txt(t.s, t.x, t.y, t.s.length > 6 ? 26 : 16, t.c); }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
